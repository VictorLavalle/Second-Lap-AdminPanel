sonar.projectKey=second-lap-admin
sonar.projectName=Second Lap Admin Panel

# Código fuente y tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Excluir de la medición lo que no es código de producción propio
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/data/**,**/node_modules/**,.next/**,coverage/**

# Excluir de la COBERTURA lo que no tiene lógica testeable (alineado con
# vitest.config.mts, que es la fuente de verdad): shell raíz, páginas estáticas
# que solo componen header + vista, el redirect raíz, tipos y datos de config.
sonar.coverage.exclusions=src/app/layout.tsx,src/app/page.tsx,src/app/login/page.tsx,src/app/productos/page.tsx,src/app/productos/nuevo/page.tsx,src/app/productos/[id]/editar/page.tsx,src/app/pedidos/page.tsx,src/app/pedidos/[id]/page.tsx,src/types/**,src/data/**

# Cobertura (generada por Vitest con reporter lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
